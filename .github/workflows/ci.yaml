name: CI

on:
  push:
    branches: [ trunk ]
  pull_request:
    branches: [ trunk ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run unit tests
        run: nix develop -c -- zig build test

      - name: Run integration tests
        run: nix develop -c -- zig build integration

      - name: Build release
        run: nix develop -c -- zig build install --release=safe
